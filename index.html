<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Waterpolo Petrer</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <img src="imagenes/logo.sin.png" class="logo" alt="Logo Club Waterpolo Petrer">

        <h1>CLUB WATERPOLO PETRER</h1>
    </header>


    <!-- HERO -->
    <section class="hero">
        <div class="hero-overlay">
            <h2>Bienvenidos al Club Waterpolo Petrer</h2>

            <p>Formación, competición y pasión por el waterpolo</p>

            <button type="button" onclick="mostrarSeccion('contacto')">
                Únete al club
            </button>
        </div>
    </section>


    <!-- MENÚ MÓVIL -->
    <button type="button"
            class="menu-movil"
            aria-controls="menu-tarjetas"
            aria-expanded="true"
            onclick="toggleMenu(this)">
        ☰ Ocultar menú
    </button>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="layout-principal">

        <!-- PATROCINADORES -->
        <aside class="sidebar izquierda">

            <div class="sponsors-track">

                <!-- Patrocinadores -->
                <div class="sponsor">
                    <img src="imagenes/sponsors/alvarez.jpg" alt="Álvarez">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/xocolate.png" alt="Xocolate">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/lacasadelperol.jpg" alt="La Casa del Perol">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/clinicamartin.png" alt="Clínica Martín">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/luisjuan.jpg" alt="Luis Juan">
                </div>


                <!-- Repetidos para el carrusel infinito -->

                <div class="sponsor">
                    <img src="imagenes/sponsors/alvarez.jpg" alt="Álvarez">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/xocolate.png" alt="Xocolate">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/lacasadelperol.jpg" alt="La Casa del Perol">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/clinicamartin.png" alt="Clínica Martín">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/luisjuan.jpg" alt="Luis Juan">
                </div>

            </div>

        </aside>


        <!-- ZONA CENTRAL -->
        <section class="zona-central">

            <p class="intro">
                Bienvenidos al Club Waterpolo Petrer.
                Formación, competición y pasión por el waterpolo.
            </p>


            <!-- TARJETAS -->
            <div class="contenedor" id="menu-tarjetas">

                <button class="card rojo" onclick="mostrarSeccion('horarios')">
                     <span class="card-icon">🕒</span>
                    <h3>Horarios</h3>
                    <p>Consultar horarios de entrenamiento</p>
                </button>


                <button class="card" onclick="mostrarSeccion('equipos')">
                    <span class="card-icon">🤽🏼‍♂️</span>
                    <h3>Equipos</h3>
                    <p>Conoce a nuestros equipos</p>
                </button>


                <button class="card rojo" onclick="mostrarSeccion('galeria')">
                    <span class="card-icon">🖼️</span>
                    <h3>Galería</h3>
                    <p>Imágenes de nuestros eventos</p>
                </button>


                <button class="card" onclick="mostrarSeccion('partidos')">
                    <span class="card-icon">⚽</span>
                    <h3>Próximos Partidos</h3>
                    <p>Consulta nuestros próximos encuentros</p>
                </button>


                <button class="card rojo" onclick="mostrarSeccion('contacto')">
                    <span class="card-icon">☎️</span>
                    <h3>Contacto</h3>
                    <p>Información de contacto</p>
                </button>


                <button class="card" onclick="mostrarSeccion('ubicacion')">
                    <span class="card-icon">📍</span>
                    <h3>Ubicación</h3>
                    <p>Descubre dónde estamos</p>
                </button>


                <button class="card rojo" onclick="mostrarSeccion('calendario')">
                    <span class="card-icon">📅</span>
                    <h3>Calendario</h3>
                    <p>Consulta los próximos partidos</p>
                </button>


                <button class="card" onclick="mostrarSeccion('compras')">
                    <span class="card-icon">🛍️</span>
                    <h3>Compras</h3>
                    <p>Material oficial del club</p>
                </button>

            </div>


            <!-- CONTENIDO DINÁMICO -->
            <div id="contenido"></div>

        </section>


        <!-- REDES SOCIALES -->
        <aside class="sidebar derecha redes">

            <a href="https://www.instagram.com/waterpolopetrer/"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link">

                <img src="imagenes/sidebar/instagram.jpg" alt="Instagram">
            </a>


            <a href="https://www.facebook.com/CWPetrer"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link">

                <img src="imagenes/sidebar/facebook.png" alt="Facebook">
            </a>

        </aside>

    </main>


    <!-- LIGHTBOX GALERÍA -->
    <div id="lightbox">

        <span class="cerrar" onclick="cerrarImagen()">✖</span>

        <span class="flecha izquierda" onclick="cambiarImagen(-1)">
            ❮
        </span>

        <img id="imagenGrande" alt="Imagen de la galería">

        <span class="flecha derecha" onclick="cambiarImagen(1)">
            ❯
        </span>

        <span id="contador"></span>

    </div>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 Club Waterpolo Petrer</p>
        <p>Piscina Cubierta San Fernando · Petrer</p>
    </footer>


    <script src="datos/partidos.js"></script>
    <script src="index.js"></script>

</body>

</html>
