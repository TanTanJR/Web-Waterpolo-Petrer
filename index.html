<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Waterpolo Petrer | Horarios, equipos y partidos</title>

    <!-- SEO básico para buscadores -->
    <meta name="description"
          content="Web del Club Waterpolo Petrer con información sobre equipos, horarios, partidos, galería, material oficial y contacto.">
    <meta name="author" content="Club Waterpolo Petrer">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ff3232">

    <!-- Icono mostrado en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="imagenes/logo.sin.png">

    <!-- Información mostrada al compartir la web -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="Club Waterpolo Petrer">
    <meta property="og:title" content="Club Waterpolo Petrer">
    <meta property="og:description"
          content="Formación, competición y pasión por el waterpolo en Petrer. Consulta equipos, horarios y partidos.">

    <!-- Vista previa para Twitter/X -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Club Waterpolo Petrer">
    <meta name="twitter:description"
          content="Formación, competición y pasión por el waterpolo en Petrer.">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>

    <!-- HEADER -->
    <header class="header">
        <img src="imagenes/logo.sin.png" class="logo" alt="Logo Club Waterpolo Petrer">

        <h1>CLUB WATERPOLO PETRER</h1>
    </header>


    <!-- HERO -->
    <section class="hero">
        <div class="hero-overlay">
            <h2>Bienvenidos al Club Waterpolo Petrer</h2>

            <p>Formación, competición y pasión por el waterpolo</p>

            <button type="button" onclick="mostrarSeccion('contacto')">
                Únete al club
            </button>
        </div>
    </section>


    <!-- MENÚ MÓVIL -->
    <button type="button"
            class="menu-movil"
            aria-controls="menu-tarjetas"
            aria-expanded="true"
            onclick="toggleMenu(this)">
        ☰ Ocultar menú
    </button>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="layout-principal" id="contenido-principal">

        <!-- PATROCINADORES -->
        <aside class="sidebar izquierda">

            <div class="sponsors-track">

                <!-- Patrocinadores -->
                <div class="sponsor">
                    <img src="imagenes/sponsors/alvarez.jpg" alt="Álvarez">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/xocolate.png" alt="Xocolate">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/lacasadelperol.jpg" alt="La Casa del Perol">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/clinicamartin.png" alt="Clínica Martín">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/luisjuan.jpg" alt="Luis Juan">
                </div>


                <!-- Repetidos para el carrusel infinito -->

                <div class="sponsor">
                    <img src="imagenes/sponsors/alvarez.jpg" alt="Álvarez">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/xocolate.png" alt="Xocolate">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/lacasadelperol.jpg" alt="La Casa del Perol">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/clinicamartin.png" alt="Clínica Martín">
                </div>

                <div class="sponsor">
                    <img src="imagenes/sponsors/luisjuan.jpg" alt="Luis Juan">
                </div>

            </div>

        </aside>


        <!-- ZONA CENTRAL -->
        <section class="zona-central">

            <p class="intro">
                Bienvenidos al Club Waterpolo Petrer.
                Formación, competición y pasión por el waterpolo.
            </p>


            <!-- TARJETAS -->
            <div class="contenedor" id="menu-tarjetas">

                <button class="card rojo" onclick="mostrarSeccion('horarios')">
                     <span class="card-icon">🕒</span>
                    <h3>Horarios</h3>
                    <p>Consultar horarios de entrenamiento</p>
                </button>


                <button class="card" onclick="mostrarSeccion('equipos')">
                    <span class="card-icon">🤽🏼‍♂️</span>
                    <h3>Equipos</h3>
                    <p>Conoce a nuestros equipos</p>
                </button>


                <button class="card rojo" onclick="mostrarSeccion('galeria')">
                    <span class="card-icon">🖼️</span>
                    <h3>Galería</h3>
                    <p>Imágenes de nuestros eventos</p>
                </button>


                <button class="card" onclick="mostrarSeccion('partidos')">
                    <span class="card-icon">⚽</span>
                    <h3>Próximos Partidos</h3>
                    <p>Consulta nuestros próximos encuentros</p>
                </button>


                <button class="card rojo" onclick="mostrarSeccion('contacto')">
                    <span class="card-icon">☎️</span>
                    <h3>Contacto</h3>
                    <p>Información de contacto</p>
                </button>


                <button class="card" onclick="mostrarSeccion('ubicacion')">
                    <span class="card-icon">📍</span>
                    <h3>Ubicación</h3>
                    <p>Descubre dónde estamos</p>
                </button>


                <button class="card rojo" onclick="mostrarSeccion('calendario')">
                    <span class="card-icon">📅</span>
                    <h3>Calendario</h3>
                    <p>Consulta los próximos partidos</p>
                </button>


                <button class="card" onclick="mostrarSeccion('compras')">
                    <span class="card-icon">🛍️</span>
                    <h3>Compras</h3>
                    <p>Material oficial del club</p>
                </button>

            </div>


            <!-- CONTENIDO DINÁMICO -->
            <div id="contenido"></div>

        </section>


        <!-- REDES SOCIALES -->
        <aside class="sidebar derecha redes">

            <a href="https://www.instagram.com/waterpolopetrer/"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link">

                <img src="imagenes/sidebar/instagram.jpg" alt="Instagram">
            </a>


            <a href="https://www.facebook.com/CWPetrer"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link">

                <img src="imagenes/sidebar/facebook.png" alt="Facebook">
            </a>

        </aside>

    </main>


    <!-- LIGHTBOX GALERÍA -->
    <div id="lightbox"
         role="dialog"
         aria-modal="true"
         aria-label="Visor de imágenes"
         aria-hidden="true">

        <button type="button" class="cerrar" onclick="cerrarImagen()" aria-label="Cerrar visor">✖</button>

        <button type="button" class="flecha izquierda" onclick="cambiarImagen(-1)" aria-label="Imagen anterior">
            ❮
        </button>

        <img id="imagenGrande" alt="Imagen de la galería">

        <button type="button" class="flecha derecha" onclick="cambiarImagen(1)" aria-label="Imagen siguiente">
            ❯
        </button>

        <span id="contador" role="status" aria-live="polite"></span>

    </div>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 Club Waterpolo Petrer</p>
        <p>Piscina Cubierta San Fernando · Petrer</p>
    </footer>


    <script src="datos/partidos.js"></script>
    <script src="js/calendario.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/tienda.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/secciones.js"></script>

</body>

</html>
